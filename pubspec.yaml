name: filinvest_bank

description: A mobile banking app

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter

  intl: ^0.20.3
  local_auth: ^3.0.2
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.2
  sqflite: ^2.4.3
  mobile_scanner: ^6.0.2
  audioplayers: ^6.0.0
  pdf: ^3.11.3
  printing: ^5.13.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/swoosh.mp3
    - assets/adidas.jpg
    - assets/easypc.jpeg
    - assets/greenwich.png
    - assets/jollibee.jpg
    - assets/mcdo.jpg
    - assets/pcexpress.png
    - assets/puma.png